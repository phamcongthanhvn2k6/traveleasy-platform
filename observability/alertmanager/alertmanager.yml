global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "default"
    # Configure a notifier through environment/secret management before production use.
    # Example: email_configs, slack_configs, or telegram_configs with values loaded
    # from Docker secrets or environment variables. Never commit real credentials.
