groups:
  - name: traveleasy-alerts
    rules:
      - alert: TravelEasyBackendDown
        expr: up{job="traveleasy-backend"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "TravelEasy backend is down"
          description: "The TravelEasy backend target is unreachable."

      - alert: TravelEasyHighHttp5xxErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{job="traveleasy-backend",status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{job="traveleasy-backend"}[5m]))
          ) > 0.05
          and sum(rate(http_server_requests_seconds_count{job="traveleasy-backend"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "TravelEasy HTTP 5xx error rate is high"
          description: "The backend 5xx rate has exceeded 5% for 5 minutes."

      - alert: TravelEasyHighHeapUsage
        expr: |
          (
            sum(jvm_memory_used_bytes{job="traveleasy-backend",area="heap"})
            /
            sum(jvm_memory_max_bytes{job="traveleasy-backend",area="heap"})
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "TravelEasy JVM heap usage is high"
          description: "JVM heap usage has exceeded 85% for 10 minutes."
