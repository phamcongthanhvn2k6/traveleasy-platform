server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: quickshop-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/quickshop_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:quickshop_user}
    password: ${SPRING_DATASOURCE_PASSWORD:quickshop_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:cXVpY2tzaG9wX3NlY3JldF9rZXlfZm9yX2p3dF9hdXRoX3Byai0wMQ==}
    expiration-ms: 86400000 # 24h
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173"
  ai:
    openai-api-key: ${SPRING_AI_OPENAI_API_KEY:mock_key}
