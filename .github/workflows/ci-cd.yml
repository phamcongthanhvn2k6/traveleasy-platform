name: TravelEasy CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Build & Test (Spring Boot)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 21 LTS
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      working-directory: ./backend
      run: chmod +x gradlew

    - name: Run Backend Unit Tests
      working-directory: ./backend
      run: ./gradlew test --no-daemon

    - name: Build Backend (Spring Boot JAR)
      working-directory: ./backend
      run: ./gradlew bootJar --no-daemon -x test

    - name: Upload Backend JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: traveleasy-backend-jar
        path: backend/build/libs/*.jar
        retention-days: 7

  frontend-ci:
    name: Frontend Build & Typecheck (React Vite)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 20 LTS
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies & Build Frontend
      working-directory: ./frontend
      run: |
        npm install --include=optional
        npm run build

    - name: Upload Frontend Dist Artifact
      uses: actions/upload-artifact@v4
      with:
        name: traveleasy-frontend-dist
        path: frontend/dist
        retention-days: 7

  docker-cd-verification:
    name: Docker Containerization & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Validate Docker Compose Configuration
      run: docker compose config

    - name: Build Docker Container Images
      run: docker compose build

    - name: CI/CD Pipeline Success Status
      run: |
        echo "=========================================================="
        echo " [TravelEasy CI/CD] All pipeline gates passed successfully!"
        echo " - Backend: Spring Boot 3.3.4 (Java 21) compiled & packaged."
        echo " - Frontend: React 18 + Vite + TypeScript built successfully."
        echo " - Containers: MySQL 8.0, Backend & Frontend Docker images ready."
        echo "=========================================================="

  deploy-to-vps:
    name: Continuous Deployment to Production VPS (Main Branch)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-cd-verification]
    if: github.ref == 'refs/heads/main'
    steps:
    - name: SSH into VPS & Execute Deployment Script
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_SSH_PORT }}
        timeout: 300s
        script: |
          set -e
          echo "🚀 [CI/CD] Bắt đầu tự động triển khai mã nguồn mới từ nhánh MAIN lên VPS..."
          whoami
          pwd
          
          # Xác định lệnh docker compose (v2) hoặc docker-compose (v1)
          if docker compose version >/dev/null 2>&1; then
            DC="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            DC="docker-compose"
          else
            echo "❌ Không tìm thấy docker compose hoặc docker-compose trên VPS!"
            exit 1
          fi
          echo "✅ Sử dụng công cụ: $DC"

          # Tìm thư mục dự án
          TARGET_DIR="/root/Nhom7_QUANLYNHAXE"
          if [ ! -d "$TARGET_DIR" ]; then
            if [ -d "/root/traveleasy-platform" ]; then
              TARGET_DIR="/root/traveleasy-platform"
            else
              echo "Thư mục $TARGET_DIR chưa tồn tại. Đang clone dự án..."
              git clone https://github.com/phamcongthanhvn2k6/traveleasy-platform.git "$TARGET_DIR"
            fi
          fi

          cd "$TARGET_DIR"
          echo "📁 Thư mục triển khai: $(pwd)"
          
          # Chuyển và kéo mã nguồn mới nhất từ nhánh production (main)
          git checkout main
          git fetch origin main
          git reset --hard origin/main
          
          # Rebuild và khởi động lại container bằng docker-compose.prod.yml
          echo "📦 [Docker] Đang build và chạy lại container trên nhánh MAIN..."
          $DC -f docker-compose.prod.yml down || true
          $DC -f docker-compose.prod.yml up -d --build
          
          echo "📋 Danh sách container đang chạy trên VPS:"
          docker ps -a

          # Dọn dẹp images cũ giải phóng dung lượng ổ cứng
          docker image prune -f
          
          echo "✅ [CI/CD] Hoàn tất triển khai tự động nhánh MAIN lên http://103.72.57.149!"
