name: TravelEasy CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Build & Test (Spring Boot)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 21 LTS
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      working-directory: ./backend
      run: chmod +x gradlew

    - name: Build Backend (Spring Boot JAR)
      working-directory: ./backend
      run: ./gradlew bootJar --no-daemon

    - name: Upload Backend JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: traveleasy-backend-jar
        path: backend/build/libs/*.jar
        retention-days: 7

  frontend-ci:
    name: Frontend Build & Typecheck (React Vite)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 20 LTS
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies & Build Frontend
      working-directory: ./frontend
      run: |
        npm install
        npm run build

    - name: Upload Frontend Dist Artifact
      uses: actions/upload-artifact@v4
      with:
        name: traveleasy-frontend-dist
        path: frontend/dist
        retention-days: 7

  docker-cd-verification:
    name: Docker Containerization & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Validate Docker Compose Configuration
      run: docker compose config

    - name: Build Docker Container Images
      run: docker compose build

    - name: CI/CD Pipeline Success Status
      run: |
        echo "=========================================================="
        echo " [TravelEasy CI/CD] All pipeline gates passed successfully!"
        echo " - Backend: Spring Boot 3.3.4 (Java 21) compiled & packaged."
        echo " - Frontend: React 18 + Vite + TypeScript built successfully."
        echo " - Containers: MySQL 8.0, Backend & Frontend Docker images ready."
        echo "=========================================================="
