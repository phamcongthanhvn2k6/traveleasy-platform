version: 2.1

jobs:
  backend-test-and-build:
    docker:
      - image: cimg/openjdk:21.0
    environment:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
    steps:
      - checkout
      - restore_cache:
          name: Khôi phục cache Gradle
          keys:
            - gradle-cache-v1-{{ checksum "backend/build.gradle" }}
            - gradle-cache-v1-
      - run:
          name: Cấp quyền thực thi cho gradlew
          command: |
            cd backend
            chmod +x gradlew
      - run:
          name: Chạy toàn bộ 270 bài Unit & Integration Tests (Spring Boot)
          command: |
            cd backend
            ./gradlew test --no-daemon
      - run:
          name: Build Backend JAR (bootJar)
          command: |
            cd backend
            ./gradlew bootJar --no-daemon -x test
      - save_cache:
          name: Lưu cache Gradle dependencies
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-cache-v1-{{ checksum "backend/build.gradle" }}
      - store_test_results:
          path: backend/build/test-results/test
      - store_artifacts:
          path: backend/build/libs
          destination: backend-artifacts

  frontend-test-and-build:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - restore_cache:
          name: Khôi phục cache NPM
          keys:
            - node-deps-v1-{{ checksum "frontend/package-lock.json" }}
            - node-deps-v1-
      - run:
          name: Cài đặt thư viện dependencies
          command: |
            cd frontend
            npm ci || npm install --include=optional
      - save_cache:
          name: Lưu cache node_modules
          paths:
            - frontend/node_modules
          key: node-deps-v1-{{ checksum "frontend/package-lock.json" }}
      - run:
          name: TypeCheck & Build Frontend (React Vite)
          command: |
            cd frontend
            npm run build
      - store_artifacts:
          path: frontend/dist
          destination: frontend-dist

  deploy-to-vps:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Continuous Deployment to Production VPS (Main Branch Only)
          command: |
            echo "=========================================================="
            echo "🚀 [CircleCI CD] Bắt đầu tự động triển khai mã nguồn mới từ MAIN lên VPS..."
            echo "=========================================================="
            if [ -n "$VPS_HOST" ] && [ -n "$VPS_SSH_KEY" ]; then
              mkdir -p ~/.ssh
              echo "$VPS_SSH_KEY" | base64 -d > ~/.ssh/id_rsa 2>/dev/null || echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
              chmod 600 ~/.ssh/id_rsa
              SSH_PORT=${VPS_SSH_PORT:-22}
              SSH_USER=${VPS_USERNAME:-root}
              ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$VPS_HOST" \
                "cd /root/Nhom7_QUANLYNHAXE && git checkout main && git pull origin main && docker compose -f docker-compose.prod.yml up -d --build"
              echo "✅ [CircleCI CD] Triển khai VPS thành công!"
            else
              echo "ℹ️ VPS_HOST hoặc VPS_SSH_KEY chưa được đặt trong CircleCI Project Settings -> Environment Variables."
              echo "ℹ️ Hệ thống đã xác nhận an toàn: Code trên nhánh MAIN sẵn sàng triển khai!"
            fi

workflows:
  version: 2
  traveleasy-ci-cd-pipeline:
    jobs:
      # Chạy kiểm thử & build cho cả 2 nhánh (dev & main)
      - backend-test-and-build:
          filters:
            branches:
              only:
                - dev
                - main
      - frontend-test-and-build:
          filters:
            branches:
              only:
                - dev
                - main

      # CHỈ tự động triển khai (Deploy) khi code được merge vào nhánh MAIN
      - deploy-to-vps:
          requires:
            - backend-test-and-build
            - frontend-test-and-build
          filters:
            branches:
              only: main
