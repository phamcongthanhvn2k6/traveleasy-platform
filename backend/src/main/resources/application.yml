server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: traveleasy-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:supabase}
  datasource:
    # Supabase Transaction Pooler (Port 6543, prepareThreshold=0 for PgBouncer compatibility):
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
    username: ${SUPABASE_DB_USERNAME:postgres.ctvcwhdepzyvqsncbslf}
    password: ${SUPABASE_DB_PASSWORD:thanhtyou123@}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TravelEasyHikariPool
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 10000
      keepalive-time: 30000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
          lob:
            non_contextual_creation: true

app:
  jwt:
    secret: ${JWT_SECRET:TravelEasyDevSecretKeyForLocalDevelopmentOnlyDoNotUseInProduction2026}
    expiration-ms: 86400000 # 24h
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173,http://localhost:5174"
  ai:
    openai-api-key: ${SPRING_AI_OPENAI_API_KEY:mock_key}

